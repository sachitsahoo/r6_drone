name: CI

# Every push and pull request. CLAUDE.md requires host build, all tests, and a target
# cross-compile on every push.
on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # protocol/generated/ is gitignored, so every job that touches the protocol has to run
  # the generator first. That is the deliberate cost of keeping the schema the single
  # source of truth (docs/decisions/0003).
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

  # Matches the developer machine exactly (Homebrew cask gcc-arm-embedded). Bump this and
  # ARM_TOOLCHAIN_SHA256 together; the checksum is for the x86_64 Linux tarball, which is
  # a different file from the macOS package the cask installs.
  ARM_TOOLCHAIN_VERSION: "15.3.rel1"
  ARM_TOOLCHAIN_SHA256: "563bebb2b97d53382b956d6ee1fe61e2cae26699901417234a37df505ef9b5fa"

jobs:
  host-build-and-test:
    name: Host build + C++ tests + cross-language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Configure
        run: cmake -B build -DTARGET=host -DPython3_EXECUTABLE=$(which python)

      - name: Build
        run: cmake --build build

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      # Runs here rather than in the Python-only job because the cross-language tests
      # drive the compiled protocol_vector_tool, which only exists after the build above.
      - name: Python tests, including cross-language verification
        run: pytest
        env:
          RECON_REQUIRE_VECTOR_TOOL: "1"

  target-cross-compile:
    name: STM32 cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The protocol generator is a build-time host tool, so the target build needs it too.
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # Proves firmware/core/ compiles for arm-none-eabi and that the firmware image
      # (firmware/stm32, ADR 0015/0016) links. This is the job that makes the portability
      # firewall real rather than aspirational. Configure also fetches the pinned CMSIS
      # headers (ADR 0016), about 11 MB.
      #
      # Installed from Arm's own release rather than Ubuntu's package, for two reasons.
      #
      # 1. Version parity. Ubuntu noble ships gcc 13.2.1; the developer machine runs
      #    15.3.1 (Homebrew cask gcc-arm-embedded). Under -Werror, a warning added or
      #    removed between two major versions makes CI and local builds disagree about
      #    identical source. Pinning both to 15.3.rel1 removes that class of surprise.
      #
      # 2. Cost. `apt-get install gcc-arm-none-eabi` pulls 574 MB and unpacks 3.1 GB,
      #    mostly multilib newlib variants this build never links against, on every push.
      #    Arm's tarball is 153 MB and is cached after the first run.
      #
      # The download is pinned by SHA-256, so a tampered or swapped artifact fails the
      # job rather than silently compiling the firmware. Bump both values together.
      - name: Cache Arm GNU Toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v4
        with:
          path: ~/arm-toolchain
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64

      - name: Download Arm GNU Toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz"
          url="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/${ARM_TOOLCHAIN_VERSION}/${archive}"
          curl -fsSL --retry 3 -o /tmp/arm-toolchain.tar.xz "$url"
          echo "${ARM_TOOLCHAIN_SHA256}  /tmp/arm-toolchain.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/arm-toolchain"
          tar -xJf /tmp/arm-toolchain.tar.xz -C "$HOME/arm-toolchain" --strip-components=1

      - name: Put the toolchain on PATH
        run: echo "$HOME/arm-toolchain/bin" >> "$GITHUB_PATH"

      # Printed so a version drift between CI and the developer machine is visible in the
      # log rather than inferred from a confusing -Werror failure.
      - name: Report toolchain version
        run: arm-none-eabi-gcc --version

      - name: Configure
        run: cmake -B build-stm32 -DTARGET=stm32 -DPython3_EXECUTABLE=$(which python)

      - name: Build
        run: cmake --build build-stm32

      # The link itself prints FLASH/RAM use (--print-memory-usage); this repeats it in a
      # step of its own so it is easy to find in the log.
      - name: Report firmware size
        run: arm-none-eabi-size build-stm32/firmware/stm32/recon_firmware.elf

  python-tests:
    name: Python tests + firewall guard (no C++ toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # the minimum the project claims to support

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # Gitignored output, so it must be produced before anything imports it.
      - name: Generate protocol bindings
        run: python protocol/generate.py

      - name: Generator output is deterministic
        run: python protocol/generate.py --check

      # CLAUDE.md hard rules 1 and 2 -- no vendor headers and no dynamic allocation in
      # firmware/core/ -- are conventions that nothing in the compiler checks. This is
      # their enforcement. The guard's own tests run in the pytest step below, so a guard
      # that stopped working cannot read green.
      - name: firmware/core purity guard
        run: python tools/check_core_purity.py

      # The cross-language tests skip here by design: no C++ toolchain in this job. They
      # run in host-build-and-test, which sets RECON_REQUIRE_VECTOR_TOOL=1.
      - name: Test
        run: pytest
