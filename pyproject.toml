[project]
name = "recon-ugv"
version = "0.1.0"
description = "Operator app, robot bridge, and analysis tools for the Recon UGV"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# protocol/generated holds the generated messages module; protocol/ holds the
# hand-written codec that imports it.
pythonpath = ["operator", "robot_bridge", "tools", "protocol", "protocol/generated"]
addopts = "-q"
