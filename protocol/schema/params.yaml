# Tunable parameters, addressed by ID over the protocol and persisted in MCU flash.
#
# Controller gains are added only when their controller's ADR is accepted, because a gain
# name presupposes a controller form (CLAUDE.md names "PID form" as an ADR-level choice).
# The drive block 0x0100-0x01FF holds ADR 0013's wheel velocity loop; the pitch block will
# follow its own ADR.
#
# The generator emits every default into C++ as `recon::protocol::param_defaults::<name>`,
# so firmware configs initialise from this file rather than from copied numbers.
#
# Every entry needs a `source` note (hard rule 6). "initial guess — to be tuned" is a
# legitimate source; silence is not.

params:

  - id: 0x0001
    name: telemetry_state_rate_Hz
    type: u16
    unit: Hz
    range: [1, 200]
    default: 100
    writable: true
    source: >
      Upper bound from docs/bringup/uart-link.md — 100 Hz of StateTelemetry is 10% of a
      460800 baud link, and 200 Hz is the point where headroom for Fault bursts disappears.
    description: StateTelemetry transmit rate.

  - id: 0x0002
    name: telemetry_power_rate_Hz
    type: u16
    unit: Hz
    range: [1, 50]
    default: 10
    writable: true
    source: >
      INA226 default conversion time is 1.1 ms per channel (datasheet SBOS547 section 7.3.4),
      so sampling faster than ~50 Hz returns repeated values.
    description: PowerTelemetry transmit rate.

  - id: 0x0003
    name: telemetry_loop_rate_Hz
    type: u16
    unit: Hz
    range: [1, 20]
    default: 5
    writable: true
    source: initial guess — loop timing is diagnostic, not something to watch continuously
    description: LoopTiming transmit rate.

  - id: 0x0010
    name: protocol_version_readback
    type: u16
    range: [0, 65535]
    default: 1
    writable: false
    source: derived — mirrors protocol_version in messages.yaml
    description: >
      Read-only. Exists so the operator can confirm which schema version the firmware was
      built from without relying on the version byte of a frame it may be rejecting.

  # ------------------------------------------------- drive: wheel velocity loop (ADR 0013)
  # Gains carry no `unit` key because their units (duty per rad/s, duty per rad) have no
  # name-suffix form; the description states them instead.

  - id: 0x0100
    name: wheel_kff
    type: f32
    range: [0.0, 1.0]
    default: 0.0
    writable: true
    source: >
      owner decision 2026-10-01 (ADR 0013 amendment): 0, because with the PI zero cancelling
      the plant pole, feedforward on top adds a closed-loop zero and ~12% step overshoot.
      Kept as a parameter in case hardware needs it; 1/K (0.0318 on the placeholder plant)
      is the value that gives zero ramp lag.
    description: Velocity feedforward, duty per rad/s of wheel speed reference.

  - id: 0x0101
    name: wheel_kp
    type: f32
    range: [0.0, 1.0]
    default: 0.0796
    writable: true
    source: >
      derived (ADR 0013, docs/theory/wheel-velocity-loop.md): kp = wc*tau/K with
      wc = 50 rad/s, tau = 0.05 s, K = 31.4 rad/s. Placeholder plant; replace after system ID.
    description: Proportional gain, duty per rad/s of speed error.

  - id: 0x0102
    name: wheel_ki
    type: f32
    range: [0.0, 50.0]
    default: 1.59
    writable: true
    source: derived (ADR 0013) — ki = kp/tau, the PI zero cancels the plant pole.
    description: >
      Integral gain, duty per rad of accumulated speed error. The integrator is stored in
      duty units, so changing this while ARMED does not step the output.

  - id: 0x0103
    name: wheel_duty_limit
    type: f32
    range: [0.0, 1.0]
    default: 0.3
    writable: true
    source: >
      CLAUDE.md hardware-in-the-loop safety: output limits low by default; raising this
      needs owner approval. Saturating, not scaling (ADR 0013, question 3).
    description: Largest |duty| the controller will command.

  - id: 0x0104
    name: wheel_max_speed_rad_s
    type: f32
    unit: rad/s
    range: [0.0, 100.0]
    default: 9.0
    writable: true
    source: >
      initial guess — just under 0.3 duty x 31.4 rad/s (9.4 rad/s), so feedforward alone
      rarely reaches the duty limit. Placeholder plant.
    description: Wheel speed reference ceiling; both wheels scale together above it.

  - id: 0x0105
    name: wheel_accel_limit_m_s2
    type: f32
    unit: m/s^2
    range: [0.05, 10.0]
    default: 1.0
    writable: true
    source: >
      initial guess (ADR 0013) — keeps the casing's pendulum disturbance small until the
      stabilizer exists. To be tuned with the stabilizer.
    description: Rate limit on each wheel's rim speed reference.

  - id: 0x0106
    name: wheel_speed_window_samples
    type: u8
    range: [1, 50]
    default: 10
    writable: true
    source: >
      ADR 0013 — 10 samples at 1 kHz trades 0.449 rad/s resolution (1400 counts/rev) for
      5 ms of delay. Upper bound is the estimator's fixed buffer size.
    description: Encoder samples spanned by the speed estimate's count difference.

  # ------------------------------------------------- safety: state machine (ADR 0014)
  # The IWDG timeout is deliberately NOT a param: a watchdog that can be changed over the
  # radio is not a watchdog. It is a build constant, core::kIwdgTimeout_ms.

  - id: 0x0200
    name: comms_timeout_ms
    type: u16
    unit: ms
    range: [50, 1000]
    default: 200
    writable: true
    source: >
      CLAUDE.md (200 ms comms watchdog); floor = 2.5 periods of the 50 Hz DriveCommand, so a
      single late frame cannot trip it.
    description: >
      No feeding frame for this long latches COMMS_TIMEOUT while ARMED. In ARMED only
      DriveCommand feeds it; in DISARMED any valid operator frame does.

  - id: 0x0201
    name: fault_brake_delay_ms
    type: u16
    unit: ms
    range: [0, 5000]
    default: 800
    writable: true
    source: >
      ADR 0014 Q2: coasting has cut the speed to 20% by then on the placeholder plant
      (coast tau 0.5 s). Re-measure at bring-up once gearbox back-drive is known.
    description: Wheels coast on entering FAULT and brake this long afterwards.

  - id: 0x0202
    name: wheel_stall_ms
    type: u16
    unit: ms
    range: [100, 2000]
    default: 500
    writable: true
    source: >
      ADR 0014 Q3 — 500 ms = 25 closed-loop time constants (tau_cl = 20 ms, ADR 0013); the
      ADR text says "about 10", an arithmetic slip corrected in its 2026-10-01 callout.
    description: >
      How long a wheel's output may stay saturated while not turning (or turning against
      its duty) before WHEEL_STALL latches.

  - id: 0x0203
    name: loop_overrun_fault_us
    type: u16
    unit: us
    range: [1500, 10000]
    default: 5000
    writable: true
    source: >
      ADR 0014 Q4 — a 5 ms gap costs wc*Td = 50 rad/s * 5 ms = 14 deg of phase margin,
      taking ADR 0013's 74 deg to 60 deg.
    description: >
      A gap between two motor-loop iterations longer than this latches LOOP_OVERRUN.
      Smaller overruns are only counted (LoopTiming.overrun_count).
